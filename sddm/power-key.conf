# Nothing Liquid: a short press of the power button puts the machine to sleep
# (the shell locks first, see hypridle's before_sleep_cmd); holding it for
# about 5 seconds shuts it down. Installed by sddm/install.sh to
# /etc/systemd/logind.conf.d/.
[Login]
HandlePowerKey=suspend
HandlePowerKeyLongPress=poweroff
