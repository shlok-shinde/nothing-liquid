[General]
# sddm/install.sh copies your wallpaper here (SDDM can't read your home folder)
background=background.jpg
# How much darker than the desktop (0 to 1)
dim=0.25
# dark or light: the glass under the controls, smoked or milky. The installer
# takes it from the shell's current colours; after that the shell's light/dark
# switch overrides it through theme.conf.user
mode=dark
# Qt date/time formats; the installer takes the time format from the shell's config
timeFormat=hh:mm
dateFormat="dddd, MMMM d"
