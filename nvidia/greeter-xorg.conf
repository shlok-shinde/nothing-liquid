# Nothing Liquid (nvidia/install.sh): the login screen's X server (SDDM's, given
# this file with -config) uses the integrated GPU alone. Left to itself it adds the
# NVIDIA GPU as a second screen, and SDDM keeps it running through the whole
# session after you log in: the NVIDIA GPU could never power off.
Section "ServerFlags"
    Option "AutoAddGPU" "off"
EndSection
